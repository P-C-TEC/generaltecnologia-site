<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 136 136" width="120" height="120" role="img" aria-label="P&amp;C Tec">
  <defs>
    <linearGradient id="pcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C6DD0"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
  </defs>
  <!-- faceted octagon "node" shape -->
  <polygon points="25,0 95,0 120,25 120,95 95,120 25,120 0,95 0,25"
           fill="url(#pcGrad)" stroke="#0B1F3A" stroke-width="2"/>
  <!-- connector dots on left/right edges, suggesting "integração" -->
  <circle cx="0" cy="60" r="7" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/>
  <circle cx="120" cy="60" r="7" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2"/>
  <!-- monogram -->
  <text x="60" y="62" text-anchor="middle" dy=".35em"
        font-family="Inter, Arial, sans-serif" font-weight="800" font-size="42"
        fill="#FFFFFF" letter-spacing="-1">P&amp;C</text>
</svg>
